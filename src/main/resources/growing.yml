# Plant blocks use native Minecraft appearances (no resource pack required).
# Allowed: POPPY, RED_MUSHROOM, DEAD_BUSH, AZALEA, OAK_SAPLING, WHEAT, LILAC, SPRUCE_SAPLING.
# Right-click a planted crop with an empty hand to see progress and paused conditions.
# Active growth time in seconds. Crops pause in unloaded chunks, darkness,
# or dry farmland. Bone meal does not accelerate these ingredient crops.
poppy:
  plant-block: POPPY
  growth-seconds: 600
mushroom:
  plant-block: RED_MUSHROOM
  growth-seconds: 480
ephedra:
  plant-block: DEAD_BUSH
  growth-seconds: 900
coca:
  plant-block: AZALEA
  growth-seconds: 900
sassafras:
  plant-block: OAK_SAPLING
  growth-seconds: 900
ergot:
  plant-block: WHEAT
  growth-seconds: 1200
salvia:
  # Single-block flower using only the lilac top half.
  plant-block: LILAC
  growth-seconds: 600
resin:
  plant-block: SPRUCE_SAPLING
  growth-seconds: 600

# Fixed active growth time; strains and shears harvesting are preserved.
cannabis:
  growth-seconds: 600
